<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#3B7DD8" />
  <circle cx="128" cy="128" r="110" fill="#4A8DE8" />

  <!-- Car body -->
  <g transform="translate(128, 115)">
    <!-- Car lower body -->
    <rect x="-62" y="0" width="124" height="35" rx="8" fill="#FFFFFF" />
    <!-- Car roof/cabin -->
    <path d="M-35,-5 L-22,-30 L22,-30 L35,-5 Z" fill="#FFFFFF" opacity="0.9" />
    <!-- Windows -->
    <path d="M-30,-3 L-20,-25 L-2,-25 L-2,-3 Z" fill="#3B7DD8" opacity="0.6" />
    <path d="M2,-3 L2,-25 L20,-25 L30,-3 Z" fill="#3B7DD8" opacity="0.6" />
    <!-- Headlights -->
    <rect x="52" y="8" width="12" height="8" rx="2" fill="#FFD54F" />
    <rect x="-64" y="8" width="12" height="8" rx="2" fill="#FF7043" />
    <!-- Wheels -->
    <circle cx="-35" cy="35" r="14" fill="#333333" />
    <circle cx="-35" cy="35" r="8" fill="#666666" />
    <circle cx="-35" cy="35" r="3" fill="#999999" />
    <circle cx="35" cy="35" r="14" fill="#333333" />
    <circle cx="35" cy="35" r="8" fill="#666666" />
    <circle cx="35" cy="35" r="3" fill="#999999" />
  </g>

  <!-- Wrench overlay (bottom right) -->
  <g transform="translate(185, 175) rotate(-45)">
    <!-- Wrench handle -->
    <rect x="-6" y="-35" width="12" height="50" rx="4" fill="#FFFFFF" />
    <!-- Wrench head -->
    <path d="M-12,-35 L-12,-50 L-4,-42 L4,-42 L12,-50 L12,-35 Z" fill="#FFFFFF" />
    <!-- Wrench detail -->
    <rect x="-3" y="-10" width="6" height="25" rx="2" fill="#4A8DE8" opacity="0.3" />
  </g>

  <!-- Gear/cog (behind wrench area) -->
  <g transform="translate(185, 175)">
    <circle cx="0" cy="0" r="18" fill="#FFD54F" />
    <circle cx="0" cy="0" r="11" fill="#4A8DE8" />
    <!-- Gear teeth -->
    <rect x="-4" y="-22" width="8" height="8" rx="1" fill="#FFD54F" />
    <rect x="-4" y="14" width="8" height="8" rx="1" fill="#FFD54F" />
    <rect x="-22" y="-4" width="8" height="8" rx="1" fill="#FFD54F" />
    <rect x="14" y="-4" width="8" height="8" rx="1" fill="#FFD54F" />
    <!-- Diagonal teeth -->
    <rect x="10" y="-19" width="8" height="8" rx="1" fill="#FFD54F" transform="rotate(45, 14, -15)" />
    <rect x="-18" y="11" width="8" height="8" rx="1" fill="#FFD54F" transform="rotate(45, -14, 15)" />
    <rect x="10" y="11" width="8" height="8" rx="1" fill="#FFD54F" transform="rotate(45, 14, 15)" />
    <rect x="-18" y="-19" width="8" height="8" rx="1" fill="#FFD54F" transform="rotate(45, -14, -15)" />
    <!-- Center hole -->
    <circle cx="0" cy="0" r="5" fill="#FFD54F" />
    <circle cx="0" cy="0" r="3" fill="#4A8DE8" />
  </g>

  <!-- Clipboard/checklist (top left accent) -->
  <g transform="translate(55, 60)">
    <rect x="-14" y="-18" width="28" height="36" rx="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="-10" y="-22" width="20" height="8" rx="3" fill="#FFFFFF" />
    <!-- Check lines -->
    <line x1="-6" y1="-8" x2="8" y2="-8" stroke="#4A8DE8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-6" y1="-1" x2="8" y2="-1" stroke="#4A8DE8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-6" y1="6" x2="8" y2="6" stroke="#4A8DE8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-6" y1="13" x2="4" y2="13" stroke="#4A8DE8" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
